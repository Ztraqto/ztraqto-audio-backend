name: check
# Checks the catalog on every push and pull request. The site (audio.ztraqto.com) picks up main within 5 minutes;
# a file that does not pass is not used there (the last good version stays).
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JSON schemas
        run: |
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=false -s schema/categories.schema.json -d categories.json
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=false -s schema/site.schema.json -d site.json
          if ls products/*.json >/dev/null 2>&1; then
            npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=false -s schema/product.schema.json -d "products/*.json"
          fi
      - name: Images, categories, links
        run: node scripts/check.mjs
